*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);

h1{font-size:20px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}

.prog{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog-num{font-size:22px;font-weight:700;letter-spacing:-.5px}
.prog-num small{font-size:13px;color:var(--dim);font-weight:400}
.bar{height:6px;background:#0a0e13;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--purple));width:0;transition:width .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:#0a0e13;border:1px solid var(--line);color:var(--dim)}
.chip b{color:var(--txt)}

.filters{display:flex;gap:7px;margin-bottom:10px;overflow-x:auto;padding-bottom:5px}
.filters button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.filters button.on{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}

.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:9px}
.item.done{opacity:.55}
.item.st-hot{border-color:#2a5138}
.item.st-no{border-color:#4a2020}
.name{font-weight:600;font-size:15px;margin-bottom:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.houses{font-size:11.5px;color:#556270;font-weight:400}
.addr{color:var(--dim);font-size:12.5px;margin-bottom:4px}
.others{color:#7a6a3a;font-size:12px;margin-bottom:8px;line-height:1.4}
.phone{display:inline-block;background:var(--acc);color:#04101f;text-decoration:none;
  padding:10px 18px;border-radius:9px;font-weight:700;font-size:15.5px;margin-bottom:10px;
  font-variant-numeric:tabular-nums}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{background:var(--card2);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.actions button.on-ok{background:#16301d;border-color:#2a5138;color:#7ee2a0}
.actions button.on-hot{background:#16301d;border-color:#3fb950;color:#7ee2a0;font-weight:600}
.actions button.on-no{background:#30161a;border-color:#5c2328;color:#ff9b9b}
.actions button.on-cb{background:#2a2316;border-color:#5c4520;color:#e8d48b}
.note{width:100%;margin-top:9px;background:#0a0e13;border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;resize:vertical}
.note::placeholder{color:#556270}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px}
.more{display:block;width:100%;background:var(--card);border:1px solid var(--line);
  color:var(--acc);border-radius:10px;padding:14px;font-size:14px;font-family:inherit;
  cursor:pointer;margin-bottom:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(11,15,20,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 12px;
  display:flex;gap:8px;max-width:820px;margin:0 auto}
.bottom a,.bottom button{flex:1;text-align:center;text-decoration:none;background:var(--card);
  border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:11px 8px;
  font-size:13px;font-family:inherit;cursor:pointer}
.bottom a.primary{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:700}
</style>

const KEY = "uk_ivanovo_fresh_v1";
let store = JSON.parse(localStorage.getItem(KEY) || "{}");
let filter = "all", limit = 15;

const $ = id => document.getElementById(id);
const save = () => localStorage.setItem(KEY, JSON.stringify(store));
const st = i => store[i] || {};

function render(){
  let done=0, hot=0, ok=0, no=0, cb=0;
  UK.forEach((u,i)=>{
    const s = st(i);
    if(s.status) done++;
    if(s.status==="hot") hot++;
    if(s.status==="ok") ok++;
    if(s.status==="no") no++;
    if(s.status==="cb") cb++;
  });

  $("p-done").textContent = done;
  $("p-all").textContent = UK.length;
  $("p-hot").innerHTML = hot + '<small> тёплых</small>';
  $("p-bar").style.width = (done/UK.length*100) + "%";
  $("c-ok").textContent = ok;
  $("c-no").textContent = no;
  $("c-cb").textContent = cb;
  $("c-left").textContent = UK.length - done;

  const rows = UK.map((u,i)=>({u,i})).filter(({i})=>{
    const s = st(i);
    if(filter==="all") return true;
    if(filter==="new") return !s.status;
    return s.status === filter;
  });

  if(!rows.length){
    $("list").innerHTML = '<div class="empty">Тут пусто.<br>Смени фильтр сверху.</div>';
    $("more").style.display = "none";
    return;
  }

  const shown = rows.slice(0, limit);
  $("list").innerHTML = shown.map(({u,i})=>{
    const s = st(i);
    const cls = s.status ? "done " + (s.status==="hot"||s.status==="ok"?"st-hot":s.status==="no"?"st-no":"") : "";
    const btn = (val,label,c2) =>
      `<button data-i="${i}" data-s="${val}" class="${s.status===val?c2:''}">${label}</button>`;

    return `<div class="item ${cls}">
      <div class="name">${u.n}${u.cnt>1?`<span class="houses">+${u.cnt-1} юрлиц</span>`:""}<span class="houses">${u.h} дом.</span></div>
      ${u.a?`<div class="addr">${u.a}</div>`:""}
      ${u.others.length?`<div class="others">Тот же номер: ${u.others.join(", ")}</div>`:""}
      <a class="phone" href="tel:${u.p}">${u.ph}</a>
      <div class="actions">
        ${btn("ok","дозвонился","on-ok")}
        ${btn("no","не берут / отказ","on-no")}
        ${btn("cb","перезвонить","on-cb")}
        ${btn("hot","🔥 интерес","on-hot")}
      </div>
      <textarea class="note" data-note="${i}" placeholder="Имя, что сказали, когда перезвонить...">${s.note||""}</textarea>
    </div>`;
  }).join("");

  if(rows.length > limit){
    $("more").style.display = "block";
    $("more").textContent = `Показать ещё (${rows.length - limit})`;
  } else {
    $("more").style.display = "none";
  }
}

document.addEventListener("click", e=>{
  const b = e.target.closest("button[data-i]");
  if(b){
    const i = b.dataset.i, val = b.dataset.s;
    store[i] = store[i] || {};
    store[i].status = store[i].status === val ? "" : val;
    save(); render(); return;
  }
  const f = e.target.closest(".filters button");
  if(f){
    document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("on"));
    f.classList.add("on"); filter = f.dataset.f; limit = 15; render(); return;
  }
});

document.addEventListener("input", e=>{
  const t = e.target.closest("textarea[data-note]");
  if(t){
    const i = t.dataset.note;
    store[i] = store[i] || {};
    store[i].note = t.value; save();
  }
});

$("more").addEventListener("click", ()=>{ limit += 20; render(); });
$("reset").addEventListener("click", ()=>{
  if(confirm("Сбросить все отметки и заметки?")){
    store = {}; save(); limit = 15; render();
  }
});

render();
</script>
